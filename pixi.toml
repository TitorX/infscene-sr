[workspace]
name = "infscene-sr"
version = "1.0.0"
channels = ["conda-forge", "https://prefix.dev/remote-sensing"]
platforms = ["linux-64", "osx-64"]

[dependencies]
python = "3.12.*"
# GDAL built with the MrSID driver, needed to read NAIP .sid files directly.
# Replace with `gdal = ">=3.10"` from conda-forge if you only read GeoTIFFs.
gdal-mrsid-builder = ">=1.0.2,<2"
opencv = ">=4.13.0,<5"
geopandas = ">=1.1.3,<2"
shapely = ">=2.1.2,<3"

[pypi-dependencies]
torch = ">=2.2.2, <3"
torchvision = ">=0.17.2, <0.26"
lightning = ">=2.6.5, <3"
tensorboard = ">=2.20.0, <3"
h5py = ">=3.16.0, <4"
tqdm = ">=4.67.3, <5"
pyyaml = ">=6.0, <7"
pillow = ">=10.0, <13"
